name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      # The NDK is reinstalled on every runner, so mtime-based checks would
      # invalidate every object; hash the compiler binary instead.
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.0.13004108" \
            > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The NDK build of llama.cpp + whisper.cpp dominates the run; ccache
      # turns a rebuild after a Kotlin-only change into seconds.
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '.gitmodules') }}-
            ccache-${{ runner.os }}-

      # Runs in about a minute without touching the NDK build, so a broken
      # test fails the run before the nine-minute native compile.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # The signing key lives in a repository secret, never in the repository.
      # Without it the build still runs and is verified, but nothing is
      # published — an unsigned APK cannot be installed anyway.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing key restored."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_B64 is not set. The release APK will be unsigned and will not be published."
          fi

      # Release only: the native build is four ARM CPU variants, and AGP
      # compiles them separately per APK variant, so building the debug APK
      # too would double a build that already dominates the run.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.available == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # The runtime depends on packaging details that never surface as build
      # errors: the engine libraries being present, every ggml CPU variant
      # being packaged, the libraries being extracted on install so ggml's
      # backend scan can see them, and 16 KB page alignment.
      - name: Verify APK packaging
        run: |
          set -euo pipefail
          # An unsigned build is named app-release-unsigned.apk, so resolve the
          # file rather than assuming which one the signing path produced.
          APK=$(ls -1 app/build/outputs/apk/release/*.apk | head -1)
          python3 scripts/verify_apk.py "$APK"

      # Publishing an APK that turns out to be unsigned would strand the
      # in-app updater, so confirm the signature before it leaves the runner.
      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-summarizer-apk
          path: app/build/outputs/apk/release/*.apk

      # The .so files in the APK are stripped, so a native crash backtrace —
      # from the in-app diagnostics or from logcat — is bare addresses. These
      # are the same libraries before AGP stripped them, and ndk-stack turns
      # those addresses into function names against them. Keep them: without
      # the copy from the exact build that crashed, a backtrace cannot be
      # symbolized at all.
      - name: Locate unstripped native libraries
        id: symbols
        run: |
          set -euo pipefail
          # AGP moved this path once already (the task name was inserted in 8.x),
          # so search rather than hardcode.
          find app/build/intermediates/merged_native_libs -name '*.so' -print \
            | tee /tmp/unstripped.txt || true
          echo "count=$(wc -l < /tmp/unstripped.txt)"

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: local-summarizer-symbols
          path: app/build/intermediates/merged_native_libs/**/*.so
          if-no-files-found: warn

      # Uploading into an existing release keeps the download URL valid even if
      # a run is cancelled midway; delete-then-recreate could leave the page 404.
      # workflow_dispatch is included deliberately: a manual rebuild that left
      # the release untouched would have the download page serve the previous
      # build, with nothing on screen saying so.
      - name: Update rolling release
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f apk-latest
          git push -f origin apk-latest
          # A tiny sidecar the app fetches to decide whether it is out of date,
          # so the update check needs no GitHub API call or release parsing.
          cat > version.json <<VERSION
          {
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "apk": "app-release.apk"
          }
          VERSION
          cat > release-notes.md <<NOTES
          Built from \`${GITHUB_REF_NAME}\` at commit ${GITHUB_SHA}.

          Download **\`app-release.apk\`** and install it on your phone.
          NOTES
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest --prerelease \
                 --title "Local Summarizer — latest APK" --notes-file release-notes.md
          gh release edit apk-latest --notes-file release-notes.md
          gh release upload apk-latest --clobber \
            app/build/outputs/apk/release/app-release.apk \
            version.json
          # Earlier runs published a debug APK too; drop it so the page offers
          # exactly one file to install.
          gh release delete-asset apk-latest app-debug.apk -y 2>/dev/null || true
