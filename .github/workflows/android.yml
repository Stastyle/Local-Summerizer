name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.0.13004108" \
            > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The NDK build of llama.cpp + whisper.cpp dominates the run; ccache
      # turns a rebuild after a Kotlin-only change into seconds.
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '.gitmodules') }}-
            ccache-${{ runner.os }}-

      - name: Build APKs
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 2G
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-summarizer-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Update rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f apk-latest
          git push -f origin apk-latest
          gh release delete apk-latest -y || true
          gh release create apk-latest \
            --prerelease \
            --title "Local Summarizer — latest APK" \
            --notes "APK builds from commit ${GITHUB_SHA}. Install app-release.apk on your phone (recommended)." \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/debug/app-debug.apk
