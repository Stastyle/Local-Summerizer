name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      # The NDK is reinstalled on every runner, so mtime-based checks would
      # invalidate every object; hash the compiler binary instead.
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.0.13004108" \
            > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The NDK build of llama.cpp + whisper.cpp dominates the run; ccache
      # turns a rebuild after a Kotlin-only change into seconds.
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '.gitmodules') }}-
            ccache-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # ggml only dispatches at runtime if every CPU-variant .so actually made
      # it into the APK, so fail the build rather than ship a silent fallback.
      - name: Verify packaged native libraries
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "Native libraries in $APK:"
          unzip -l "$APK" | grep '\.so$' | awk '{print $4, $1}'
          for required in libsummarizer.so libggml-base.so libllama.so libwhisper.so libc++_shared.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$required" \
              || { echo "::error::missing $required"; exit 1; }
          done
          variants=$(unzip -l "$APK" | grep -c 'libggml-cpu-.*\.so' || true)
          echo "ggml CPU variants packaged: $variants"
          [ "$variants" -ge 2 ] || { echo "::error::runtime CPU dispatch has no variants"; exit 1; }

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-summarizer-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      # Uploading into an existing release keeps the download URL valid even if
      # a run is cancelled midway; delete-then-recreate could leave the page 404.
      - name: Update rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f apk-latest
          git push -f origin apk-latest
          cat > release-notes.md <<NOTES
          Built from \`${GITHUB_REF_NAME}\` at commit ${GITHUB_SHA}.

          **Install \`app-release.apk\`** — that is the one for your phone.

          \`app-debug.apk\` is signed with a different key and installs alongside it
          as a separate \`.debug\` app, for troubleshooting only.
          NOTES
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest --prerelease \
                 --title "Local Summarizer — latest APK" --notes-file release-notes.md
          gh release edit apk-latest --notes-file release-notes.md
          gh release upload apk-latest --clobber \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/debug/app-debug.apk
